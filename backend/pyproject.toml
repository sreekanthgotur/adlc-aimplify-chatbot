[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "aimplify-intake"
version = "0.1.0"
description = "AIMPLIFY conversational idea intake backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aws-sdk-transcribe-streaming==0.12.0",
  "boto3>=1.35.0",
  "fastapi>=0.111.0",
  "langgraph>=0.2.0",
  "pydantic>=2.7.0",
  "psycopg[binary]>=3.1.19",
  "SQLAlchemy>=2.0.32",
  "alembic>=1.13.2",
  "PyPDF2>=3.0.1",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.0",
  "uvicorn[standard]>=0.30.1",
  "python-dotenv>=1.0.4",
  "authlib>=1.3.2",
  "itsdangerous>=2.2.0",
  "httpx>=0.27.0",
  "joserfc>=1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "hypothesis>=6.100.0",
  "httpx>=0.27.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aimplify_intake"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.mypy]
python_version = "3.12"
packages = ["aimplify_intake"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["aws_sdk_transcribe_streaming.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
