name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: pip install uv

      - name: Install backend dependencies
        run: uv sync --project backend --all-extras

      - name: Run backend tests
        run: uv run --project backend pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm run test --prefix frontend -- --run

      - name: Type-check frontend
        run: npm run typecheck --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

  golden-evaluation:
    needs:
      - backend
      - frontend
    runs-on: ubuntu-latest
    steps:
      - name: Reserve Phase 2 golden-evaluation harness
        run: echo "Golden evaluation job reserved for the Phase 2 harness wiring."
